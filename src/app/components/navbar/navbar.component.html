<header class="navbar">
  <div class="container nav-inner">

    <!-- Brand -->
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 2 L20 7 V17 L12 22 L4 17 V7 Z" />
          <path d="M12 7 L16 9.5 V14.5 L12 17 L8 14.5 V9.5 Z" />
        </svg>
      </span>
      <span class="brand-text">Commisio<span class="brand-accent">Nyx</span></span>
    </a>

    <!-- Primary navigation -->
    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/browse" routerLinkActive="active" (click)="closeMenu()">Browse Art</a>
      <a routerLink="/commissions" routerLinkActive="active" (click)="closeMenu()">Commissions</a>
      <a routerLink="/artists" routerLinkActive="active" (click)="closeMenu()">Artists</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
    </nav>

    <!-- Right hand actions -->
    <div class="nav-actions">

      <!-- Signed in: greet the user and offer a sign out -->
      <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
        <span class="nav-user" [title]="user.email">
          <span class="nav-user-dot"></span>
          {{ user.name }}
        </span>
        <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Sign Out</button>
      </ng-container>

      <!-- Signed out: link to the login page -->
      <ng-template #guestLinks>
        <a routerLink="/login" class="btn btn-outline btn-sm" (click)="closeMenu()">Sign In</a>
      </ng-template>

      <!-- Cart with a live item counter -->
      <a routerLink="/cart" class="cart-link" (click)="closeMenu()" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M6 6h15l-1.5 9h-12z" />
          <path d="M6 6 5 3H2" />
          <circle cx="9" cy="20" r="1.4" />
          <circle cx="18" cy="20" r="1.4" />
        </svg>
        <span class="cart-count" *ngIf="(itemCount$ | async) as count" [class.zero]="count === 0">{{ count }}</span>
      </a>

      <!-- Mobile menu button -->
      <button
        type="button"
        class="menu-toggle"
        [class.open]="menuOpen"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</header>
